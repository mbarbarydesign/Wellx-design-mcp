<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellx Unified Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Figtree:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/wellx-logo-mark.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/wellx-logo-mark-512.png">
  <link rel="apple-touch-icon" href="assets/wellx-logo-mark-512.png">
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation" title="Open navigation">☰</button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <img class="sb-logo-img" src="assets/wellx-logo-mark.svg" alt="Wellx" style="height:24px;width:auto">
        <span class="sb-title">Design System<small>Wellx Unified</small></span>
        <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2.75" width="14" height="12.5" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7 2.75v12.5" stroke="currentColor" stroke-width="1.6"/><path d="m13 7-2 2 2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <nav class="sb-nav" id="nav">
        <div class="sb-group">
          <span class="sb-group-label">Overview</span>
          <a class="nav-item" href="#/whats-new" data-route="whats-new">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v3M9 13v3M2 9h3M13 9h3M4.2 4.2l2 2M11.8 11.8l2 2M13.8 4.2l-2 2M6.2 11.8l-2 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
            What's new
          </a>
        </div>

        <div class="sb-group">
          <span class="sb-group-label">Library</span>
          <span class="nav-item" id="wellxToggle" role="button" tabindex="0" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="2.5" width="13" height="13" rx="4" stroke="currentColor" stroke-width="1.75"/><path d="m5.5 7 2 4.5L9 8.5l1.5 3 2-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Wellx
            <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m5 3.5 4 3.5-4 3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="nav-sub" id="wellxSub">
            <a class="nav-item" href="#/colors" data-route="colors">Color tokens</a>
            <span class="nav-item" id="componentsToggle" role="button" tabindex="0" aria-expanded="false">
              Components
              <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m5 3.5 4 3.5-4 3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <div class="nav-sub" id="componentsSub"><!-- populated by app.js --></div>
          </div>
          <span class="nav-item" id="labsToggle" role="button" tabindex="0" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 2.5h4M8 2.5v4.2L4 13a2.2 2.2 0 0 0 2 3.2h6a2.2 2.2 0 0 0 2-3.2l-4-6.3V2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Wellx Labs
            <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m5 3.5 4 3.5-4 3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="nav-sub" id="labsSub"><!-- populated by app.js --></div>
        </div>

        <div class="sb-group">
          <span class="sb-group-label">Resources</span>
          <a class="nav-item" href="#/install" data-route="install">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2.5v8M5.8 7.5 9 10.7l3.2-3.2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12v2.5A1 1 0 0 0 4 15.5h10a1 1 0 0 0 1-1V12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
            How to install
          </a>
          <a class="nav-item" href="#/creator" data-route="creator">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="m10.5 3.5 4 4L6 16H2v-4l8.5-8.5ZM9 5l4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Design system creator
          </a>
        </div>
      </nav>

      <div class="sb-foot">
        <span class="version-chip" id="versionChip">v2.1.1</span>
        <div class="theme-toggle" role="group" aria-label="Color mode">
          <button type="button" data-mode="light" aria-pressed="false">Light</button>
          <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
          <button type="button" data-mode="auto" aria-pressed="true">Auto</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page" id="page"><!-- routed content --></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
